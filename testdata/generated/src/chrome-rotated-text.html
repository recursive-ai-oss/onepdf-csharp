<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>chrome-rotated-text</title>
<style>
@page{size:A4;margin:20mm}
body{font-family:'Liberation Serif',serif;font-size:12pt;line-height:1.4}
p{margin:0 0 10pt 0}
.pb{break-after:page}
.r{position:absolute;left:150mm;top:25mm;width:200mm;transform-origin:0 0;transform:rotate(90deg)}
</style>
</head>
<body>
<p>The harbor town woke slowly. Fishing boats rocked against their moorings while gulls argued over the morning catch.</p><p class="r">By nine the market stalls were open, and the smell of fresh bread drifted along the quay toward the old customs house.</p>
</body>
</html>
