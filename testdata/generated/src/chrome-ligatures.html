<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<title>chrome-ligatures</title>
<style>
@page{size:A4;margin:20mm}
body{font-family:'Liberation Serif',serif;font-size:12pt;line-height:1.4}
p{margin:0 0 10pt 0}
.pb{break-after:page}
