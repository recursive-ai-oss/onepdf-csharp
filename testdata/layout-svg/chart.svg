<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" font-family="sans-serif">
  <title>Quarterly sales</title><desc>Bar chart of sales by quarter</desc>
  <rect width="300" height="180" fill="#fafafa"/>
  <g stroke="#ccc" stroke-width="1"><line x1="40" y1="20" x2="40" y2="140"/><line x1="40" y1="140" x2="280" y2="140"/><line x1="40" y1="80" x2="280" y2="80" stroke-dasharray="3 3"/></g>
  <g fill="#4e79a7"><rect x="60" y="60" width="36" height="80"/><rect x="110" y="40" width="36" height="100"/><rect x="160" y="90" width="36" height="50"/><rect x="210" y="30" width="36" height="110" fill="#e15759"/></g>
  <g font-size="11" text-anchor="middle" fill="#333"><text x="78" y="156">Q1</text><text x="128" y="156">Q2</text><text x="178" y="156">Q3</text><text x="228" y="156">Q4</text></g>
  <text x="150" y="14" font-size="13" text-anchor="middle" font-weight="bold">Quarterly sales</text>
  <polyline points="78,60 128,40 178,90 228,30" fill="none" stroke="#f28e2b" stroke-width="2"/>
</svg>
