<h1>الإعلان العالمي لحقوق الإنسان</h1>
<h2>المادة 1</h2>
<p>يولد جميع الناس أحرارا متساوين في الكرامة والحقوق. وقد وهبوا عقلا وضميرا وعليهم أن يعامل بعضهم بعضا بروح الإخاء.</p>
<h2>المادة 3</h2>
<p>لكل فرد الحق في الحياة والحرية وسلامة شخصه.</p>
<p>تشمل هذه الحقوق ما يلي:</p>
<ul>
<li>الحياة</li>
<li>الحرية</li>
<li>سلامة الشخص</li>
</ul>
