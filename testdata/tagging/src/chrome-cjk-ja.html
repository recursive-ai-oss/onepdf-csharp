<h1>世界人権宣言</h1>
<h2>第一条</h2>
<p>すべての人間は、生れながらにして自由であり、かつ、尊厳と権利とについて平等である。人間は、理性と良心とを授けられており、互いに同胞の精神をもって行動しなければならない。</p>
<h2>第三条</h2>
<p>すべての人は、生命、自由及び身体の安全に対する権利を有する。</p>
<p>この権利には次のものが含まれる。</p>
<ul>
<li>生命</li>
<li>自由</li>
<li>身体の安全</li>
</ul>
